<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirecting to the newsletter signup | Arrell Advisory</title>
<meta http-equiv="refresh" content="0; url=/#newsletter">
<meta name="robots" content="noindex">
<script>
// Takes visitors to the newsletter section already on the site, which posts to
// MailerLite account 1271838, form 189648362613507643. Nothing is embedded or
// recreated here, and no second subscription pathway exists.
//
// A query string has to sit before the fragment, so it cannot simply be appended
// the way the other stubs append window.location.search. The meta refresh above
// is the no-JavaScript path and is static, so it carries no parameters.
(function () {
  var query = window.location.search.slice(1);
  window.location.replace('/' + (query ? '?' + query : '') + '#newsletter');
})();
</script>
</head>
<body>
<p>Taking you to the newsletter signup. <a href="/#newsletter">Continue to the AI Without The Panic signup &rarr;</a></p>
</body>
</html>
